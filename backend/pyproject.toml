[project]
name = "hikmah-backend"
version = "0.1.0"
description = "Hikmah Online LMS backend (Django + DRF)"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "django>=6.1.3",
    "django-allauth[mfa,socialaccount]>=65.21.1",
    "django-anymail[resend]>=15.2",
    "django-axes>=9.0.0",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-import-export>=4.4.5",
    "django-q2>=1.11.1",
    "django-storages[s3]>=1.14.6",
    "django-unfold>=0.110.1",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "filetype>=1.2.0",
    "gunicorn>=27.0.0",
    "markdown>=3.11.3",
    "nh3>=0.3.7",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8",
    "pyyaml>=6.0.3",
    "qrcode[pil]>=8.2",
    "requests>=2.34.2",
    "weasyprint>=70.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "freezegun>=1.5.5",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "responses>=0.26.3",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q --reuse-db"
filterwarnings = ["ignore::DeprecationWarning", "ignore:The EMAIL_:PendingDeprecationWarning", "ignore:The EMAIL_"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
